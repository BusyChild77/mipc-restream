target-version = "py312"
line-length = 88

# The vendored client is generated by mipc-client's tools/vendor.py and is
# already linted there. Reformatting it here would only make the copy differ
# from its source, which is exactly what the sync check looks for.
extend-exclude = ["src/mipc_client"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[lint.per-file-ignores]
"tests/*" = ["D"]
