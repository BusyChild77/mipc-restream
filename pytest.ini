[pytest]
# asyncio_mode is load-bearing: without it the bare `async def test_*` functions
# this suite is written with are not collected at all.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# The vendored client is covered by its own repository's suite, not by this one.
addopts = --cov=mipc_restream --cov-report=term-missing
